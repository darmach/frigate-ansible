---
  - name: Update and upgrade apt packages
    apt:
      upgrade: no
      update_cache: yes
    when: apt_upgrade

  - name: Install packages
    apt:
      pkg:
        - vim
        - ca-certificates
        - curl
        - isenkram
        - gnupg2
  # - name: Check if docker key exists
  #   stat:
  #     path: /etc/apt/keyrings/docker.asc
  #   register: docker_key
  # - name: Download docker repo signature
  #   get_url:
  #     url: https://download.docker.com/linux/debian/gpg
  #     dest: /etc/apt/keyrings/docker.asc
  #     mode: 0644
  #     force: true
  #   when: not docker_key.stat.exists
  - name: Add the docker repo key
    ansible.builtin.apt_key:
      url: https://download.docker.com/linux/debian/gpg
      state: present

  - name: Add docker apt repository
    apt_repository:
      repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution|lower }} {{ ansible_distribution_release }} stable"
      state: present
      update_cache: yes
      filename: docker

  - name: Install docker
    apt:
      name: docker-ce
      state: present

  - name: Add {{ user }} user to docker group
    user:
      name: '{{ user }}'
      groups: docker
      append: yes

  - name: Install Hetrix heartbeat monitor
    ansible.builtin.cron:
      name: "hetrixtools heartbeat monitor"
      minute: "*/5"
      hour: "*"
      day: "*"
      month: "*"
      weekday: "*"
      job: "/usr/bin/curl --retry 3 --retry-delay 1 -m 15 https://sm.hetrixtools.net/hb/?s={{ hetrix_token }} >/dev/null 2>&1"
    when: hetrix_token is defined
