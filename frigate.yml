---
  - name: Create directories
    become: True
    file:
      path: "{{ item }}"
      state: directory
      owner: "{{ user }}"
      mode: "0700"
    loop:
      - /var/lib/frigate
      - /var/lib/frigate/config
      - /var/lib/frigate/storage

  - name: Prepare storage
    become: True
    block:
    - name: Check if volume group exists
      command: vgs frigate
      register: vg_status
      ignore_errors: true
      changed_when: false

    - name: Create a volume group on devices
      lvg:
        vg: "frigate"
        # Aggregates all devices into a single list so the VG uses all of them
        pvs: "{{ mounts | dict2items | map(attribute='value.device') | list }}"
      # Only attempts to create/modify VG if it doesn't exist
      when: vg_status.rc != 0

    - name: Create a logical volume for frigate
      lvol:
        vg: "frigate"
        lv: "{{ item.key }}"
        size: "100%FREE"
        shrink: False
      with_dict: "{{ mounts }}"

    - name: Create a filesystem
      filesystem:
        fstype: "{{ item.value.fstype }}"
        dev: "/dev/frigate/{{ item.key }}"
        resizefs: False
      with_dict: "{{ mounts }}"

    - name: Mount storage
      mount:
        path: "/var/lib/frigate/{{ item.key }}"
        src: "/dev/frigate/{{ item.key }}"
        fstype: "{{ item.value.fstype }}"
        state: mounted
      with_dict: "{{ mounts }}"
    when: mounts is defined

  - name: Template files
    template:
      backup: True
      src: "{{ item.key }}"
      dest: "{{ item.value }}"
    with_dict:
      "template/config.yml.j2": "/var/lib/frigate/config/config.yml"
      "template/docker-compose.yml.j2": "/var/lib/frigate/docker-compose.yml"
    register: templates

  - name: Restart frigate container
    community.docker.docker_container:
      name: frigate
      restart: true
    when: templates.results[0].changed and not templates.results[1].changed


  - name: Docker compose
    block:
      - name: Run docker compose up
        community.docker.docker_compose_v2:
          project_src: /var/lib/frigate
        register: output

      - name: Show results
        ansible.builtin.debug:
          var: output.actions

    when: templates.results[1].changed
